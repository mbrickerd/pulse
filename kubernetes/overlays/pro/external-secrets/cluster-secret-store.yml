# ClusterSecretStore — connects External Secrets Operator to GCP Secret Manager.
#
# PREREQUISITES (one-time setup before applying this):
#
# 1. Install ESO via Helm:
#      helm repo add external-secrets https://charts.external-secrets.io
#      helm install external-secrets external-secrets/external-secrets \
#        --namespace external-secrets \
#        --create-namespace \
#        --set serviceAccount.annotations."iam\.gke\.io/gcp-service-account"=eso@PROJECT_ID.iam.gserviceaccount.com
#
# 2. Create the ESO Google Service Account:
#      gcloud iam service-accounts create eso --project=PROJECT_ID
#      gcloud projects add-iam-policy-binding PROJECT_ID \
#        --member="serviceAccount:eso@PROJECT_ID.iam.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#
# 3. Bind the ESO Kubernetes SA to the GSA via Workload Identity:
#      gcloud iam service-accounts add-iam-policy-binding eso@PROJECT_ID.iam.gserviceaccount.com \
#        --role="roles/iam.workloadIdentityUser" \
#        --member="serviceAccount:PROJECT_ID.svc.id.goog[external-secrets/external-secrets]"
#
# Fill in PROJECT_ID, REGION, and CLUSTER_NAME below before applying.
#   terraform output: gke_cluster_name  → CLUSTER_NAME
#   terraform output: var.region        → REGION (e.g., us-central1)
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: REGION
          clusterName: CLUSTER_NAME
          clusterProjectID: PROJECT_ID
          serviceAccountRef:
            # The KSA created by ESO's Helm chart in the external-secrets namespace
            name: external-secrets
            namespace: external-secrets
