apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pulse
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: pulse
            - name: POSTGRES_USER
              value: pulse
            - name: POSTGRES_PASSWORD
              value: pulse
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pulse
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
