# Replace the Google Cloud exporter with the debug (stdout) exporter.
# The googlecloud exporter requires Workload Identity — not available locally.
# Traces are visible via: kubectl logs -n pulse -l app=otel-collector
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pulse
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      otlp:
        protocols:
          http:
            endpoint: "0.0.0.0:4318"
          grpc:
            endpoint: "0.0.0.0:4317"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      debug:
        verbosity: detailed

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
