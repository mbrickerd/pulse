apiVersion: apps/v1
kind: Deployment
metadata:
  name: submitter
  namespace: pulse
  labels:
    app: submitter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: submitter
  template:
    metadata:
      labels:
        app: submitter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: submitter
      containers:
        - name: submitter
          # Short name resolved to full registry path by overlays/prod/kustomization.yaml images transformer
          image: submitter:latest
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            # All terraform-output config values come from this ConfigMap.
            # Generated by the overlay from overlays/pro/config.env.
            - configMapRef:
                name: pulse-config
          env:
            # NODE_IP must be injected via Downward API — not available as a ConfigMap value.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://$(NODE_IP):4318/v1/traces"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: submitter
