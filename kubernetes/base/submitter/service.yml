apiVersion: v1
kind: Service
metadata:
  name: submitter
  namespace: pulse
  annotations:
    cloud.google.com/backend-config: '{"default": "submitter"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: submitter
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
