apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: pulse
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      otlp:
        protocols:
          http:
            endpoint: "0.0.0.0:4318"
          grpc:
            endpoint: "0.0.0.0:4317"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      resourcedetection:
        # Detects GCP project ID, cluster name, and zone from the metadata server.
        # The googlecloud exporter uses these to route traces to the right project.
        # No explicit project ID needed — Workload Identity handles auth automatically.
        detectors: [gcp]
        timeout: 10s
        override: false

    exporters:
      googlecloud: {}

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resourcedetection]
          exporters: [googlecloud]
